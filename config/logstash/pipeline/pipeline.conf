input {
  beats {
    port => 5044
    ecs_compatibility => "v8"
  }
}

filter {

  # Auditbeat's labels.dedot replaces dots in Docker label names with underscores.
  if [container][labels][com_redcanary_atomic_test] {
    mutate {
      copy => { "[container][labels][com_redcanary_atomic_test]" => "[atomic][test]" }
    }
  }

  if [container][labels][com_redcanary_atomic_guid] {
    mutate {
      copy => { "[container][labels][com_redcanary_atomic_guid]" => "[atomic][guid]" }
    }
  }

  if [container][labels][com_redcanary_atomic_testrun] {
    mutate {
      copy => { "[container][labels][com_redcanary_atomic_testrun]" => "[atomic][testrun]" }
    }
  }

  if [atomic][testrun] and [atomic][test] {
    mutate {
      
      add_field => { "index" => "security-auditbeat-%{[atomic][testrun]}-%{[atomic][test]}-%{+YYYY.MM.dd}" }
      replace => { "[@metadata][auditbeat_index]" => "security-auditbeat-%{[atomic][testrun]}-%{[atomic][test]}-%{+YYYY.MM.dd}" }
    }
  } else {
    mutate {
      replace => { "[@metadata][auditbeat_index]" => "security-auditbeat-%{+YYYY.MM.dd}" }
    }
  }

  mutate {
    remove_field => ["[container][labels]"]
  }
}

output {
  opensearch {
    hosts => ["https://opensearch:9200"]
    user => "admin"
    password => "${OPENSEARCH_PASSWORD}"
    index => "%{[@metadata][auditbeat_index]}"
    ssl_certificate_verification => false
  }
}
