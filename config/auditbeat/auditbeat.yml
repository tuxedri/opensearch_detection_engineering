auditbeat.modules:
  - module: auditd
    audit_rule_files: []
    audit_rules: |
      -a always,exit -F arch=b64 -S execve,execveat -k detection-lab-exec
      -a always,exit -F arch=b32 -S execve,execveat -k detection-lab-exec
    backlog_limit: 8192
    failure_mode: silent
    rate_limit: 0
    resolve_ids: true
    socket_type: unicast

processors:
  - add_host_metadata: ~
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
      match_pids: ["process.pid", "process.parent.pid"]
      match_source: false
      labels.dedot: true

output.logstash:
  hosts:
    - logstash:5044

logging.level: info
logging.to_files: false
